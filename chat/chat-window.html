<div class="moira-chat-container">
  <div class="moira-chat-header">
    <h2><i class="fas fa-robot"></i> Moira - AI Game Master</h2>
    <span class="moira-version">v{{version}}</span>
  </div>

  <div class="moira-chat-messages">
    <!-- Messages rendered here -->
    <div class="moira-empty-state" style="text-align: center; padding: 60px 20px; color: var(--moira-text-muted);">
      <i class="fas fa-robot" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px;"></i>
      <p style="font-size: 14px;">Moira is ready to assist your game.</p>
      <p style="font-size: 12px; margin-top: 8px;">Press Enter or click the send button to begin.</p>
    </div>
  </div>

  <div class="moira-input-area">
    <textarea
      name="moira-prompt"
      class="moira-prompt-input"
      placeholder="Ask Moira anything... (Enter to send, Shift+Enter for new line)"
      rows="1"
    ></textarea>
    <div class="moira-input-row">
      <div class="moira-input-tools">
        <button type="button" class="moira-tool-btn" data-action="enhance" title="Enhance text">
          <i class="fas fa-wand-magic-sparkles"></i> Enhance
        </button>
        <button type="button" class="moira-tool-btn" data-action="generate-image" title="Generate image">
          <i class="fas fa-image"></i> Image
        </button>
      </div>
      <button type="button" class="moira-send-btn" data-action="send" title="Send message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    <div class="moira-enhance-panel" style="display: none; margin-top: 8px;">
      <select class="moira-enhance-select" style="width: 100%; background: var(--moira-bg-light); border: 1px solid var(--moira-border); border-radius: 6px; color: var(--moira-text); padding: 6px 10px; font-size: 12px;">
        <option value="improve">Improve / Enhance</option>
        <option value="shorten">Shorten</option>
        <option value="expand">Expand / Elaborate</option>
        <option value="dialogue">Convert to Dialogue</option>
      </select>
    </div>
  </div>

  <div class="moira-status-bar">
    <div class="moira-status">
      <span class="moira-status-dot moira-status-dot--disconnected"></span>
      <span>Not connected</span>
    </div>
    <div class="moira-model-indicator">
      <!-- Model shown here -->
    </div>
  </div>
</div>
