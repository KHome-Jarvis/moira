<div class="moira-chat-container" id="moira-chat-container">
  <div class="moira-chat-header" data-moira="toggle">
    <h3>🧙 Moira — AI GM Companion</h3>
    <span id="moira-toggle-icon">▼</span>
  </div>
  <div class="moira-chat-body" id="moira-body">
    <div class="moira-msg moira">Hello. I am Moira, your AI GM companion. Ask me anything about your game, and I will do my best to assist.</div>
  </div>
  <div class="moira-chat-input-row">
    <input type="text" id="moira-input" placeholder="Ask Moira anything..." autocomplete="off" />
    <button class="moira-btn moira-btn-primary" data-moira="send">Send</button>
    <button class="moira-btn moira-btn-secondary" data-moira="clear">Clear</button>
  </div>
</div>
