<div class="moira-queue-container">
  <div class="moira-queue-header">
    <h2><i class="fas fa-list"></i> Moira Queue</h2>
    <div>
      <button data-action="refresh" style="background: var(--moira-surface-hover); margin-right: 8px;">
        <i class="fas fa-refresh"></i>
      </button>
      <button data-action="clear-all" style="background: var(--moira-danger);">
        <i class="fas fa-trash"></i> Clear All
      </button>
    </div>
  </div>

  <div class="moira-queue-list">
    {{#if jobs.length}}
      {{#each jobs}}
      <div class="moira-queue-item" data-job-id="{{id}}">
        <div class="moira-queue-item-info">
          <div class="moira-queue-item-label">{{label}}</div>
          <div class="moira-queue-item-meta">
            <i class="fas fa-clock"></i> {{createdAt}}
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="moira-queue-item-status moira-queue-item-status--{{status}}">{{status}}</span>
          {{#if (eq status "pending")}}
          <i class="fas fa-spinner fa-spin" style="color: var(--moira-warning);"></i>
          {{/if}}
          <button data-action="remove" style="background: none; border: none; color: var(--moira-danger); cursor: pointer; padding: 4px;" title="Remove">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      {{/each}}
    {{else}}
      <div class="moira-queue-empty">
        <i class="fas fa-check-circle" style="font-size: 48px; opacity: 0.3; margin-bottom: 16px;"></i>
        <p>No jobs in queue</p>
      </div>
    {{/if}}
  </div>
</div>
